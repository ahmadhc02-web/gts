    <meta name="apple-mobile-web-app-title" content="GTS System" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" />

    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" />

    <title>Green Tech Services ISP Management</title>
    <meta name="description" content="ISP Service Management Dashboard with real-time network latency monitoring, ISP diagnostics, and customer complaint tracking." />
    <meta property="og:title" content="Green Tech Services ISP Management" />
    <meta property="og:description" content="ISP Service Management Dashboard with real-time network latency monitoring, ISP diagnostics, and customer complaint tracking." />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      (function() {
        // Suppress benign Vite WebSocket/HMR runner transport errors (disabled by design in cloud iframe preview)
        window.addEventListener('error', function(event) {
          if (event && (
            (event.message && (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('createWebSocketModuleRunnerTransport') !== -1)) ||
            (event.filename && event.filename.indexOf('@vite/client') !== -1)
          )) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && (
            (event.reason.message && (event.reason.message.indexOf('WebSocket') !== -1 || event.reason.message.indexOf('createWebSocketModuleRunnerTransport') !== -1)) ||
            (event.reason.stack && event.reason.stack.indexOf('@vite/client') !== -1)
          )) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
          }
        }, true);
      })();
    </script>
    <script>
      (function() {
        // Enforce clean cache and prevent service worker issues in development
        if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
          try {
            var dummyReg = {
              active: null,
              installing: null,
              waiting: null,
              scope: '/',
              unregister: function() { return Promise.resolve(true); },
              update: function() { return Promise.resolve(); },
              addEventListener: function() {},
              removeEventListener: function() {},
              dispatchEvent: function() { return false; }
            };
            navigator.serviceWorker.register = function() {
              return Promise.resolve(dummyReg);
            };
          } catch (e) {}
          try {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              if (regs && regs.length > 0) {
                for (var i = 0; i < regs.length; i++) {
                  try { regs[i].unregister(); } catch (err) {}
                }
              }
            }).catch(function() {});
          } catch (e) {}
        }
      })();
    </script>
    <script>
      (function() {
        try {
          var saved = null;
          try {
            saved = localStorage.getItem('theme');
          } catch (e) {}
          if (!saved) {
            var matchCookie = document.cookie.match(/(?:^|; )theme=([^;]*)/);
            if (matchCookie) {
              saved = decodeURIComponent(matchCookie[1]);
            }
          }
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
