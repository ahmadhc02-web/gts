<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GTS System" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563eb" />
    <title>Green Tech Services ISP Management</title>
    <meta name="description" content="ISP Service Management Dashboard with real-time network latency monitoring, ISP diagnostics, and customer complaint tracking." />
    <meta property="og:title" content="Green Tech Services ISP Management" />
    <meta property="og:description" content="ISP Service Management Dashboard with real-time network latency monitoring, ISP diagnostics, and customer complaint tracking." />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      (function() {
        // Enforce clean cache and prevent service worker issues in development
        if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
          try {
            var dummyReg = {
              active: null,
              installing: null,
              waiting: null,
              scope: '/',
              unregister: function() { return Promise.resolve(true); },
              update: function() { return Promise.resolve(); },
              addEventListener: function() {},
              removeEventListener: function() {},
              dispatchEvent: function() { return false; }
            };
            navigator.serviceWorker.register = function() {
              return Promise.resolve(dummyReg);
            };
          } catch (e) {}
          try {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              if (regs && regs.length > 0) {
                for (var i = 0; i < regs.length; i++) {
                  try { regs[i].unregister(); } catch (err) {}
                }
              }
            }).catch(function() {});
          } catch (e) {}
        }
      })();
    </script>
    <script>
      (function() {
        try {
          var saved = null;
          try {
            saved = localStorage.getItem('theme');
          } catch (e) {}
          if (!saved) {
            var matchCookie = document.cookie.match(/(?:^|; )theme=([^;]*)/);
            if (matchCookie) {
              saved = decodeURIComponent(matchCookie[1]);
            }
          }
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
